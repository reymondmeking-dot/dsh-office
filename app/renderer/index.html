<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>DSH Office</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="browser.css" />
<link rel="stylesheet" href="projects.css" />
<link rel="stylesheet" href="resources.css" />
<link rel="stylesheet" href="shell.css" />
</head>
<body>
<header id="titlebar">
  <div class="titlebar-main">
    <div class="window-identity">
      <div class="traffic">
        <button class="tl close" id="btn-close" data-i18n-title="tb.close"></button>
        <button class="tl min" id="btn-min" data-i18n-title="tb.min"></button>
        <button class="tl max" id="btn-max" data-i18n-title="tb.max"></button>
      </div>
      <div class="brand"><span class="logo">▣</span> DSH Office <span class="app-version">1.5.0</span></div>
    </div>
    <div id="status-pill" role="status" aria-live="polite" aria-atomic="true"><span class="dot"></span><span id="status-text" data-i18n="status.idle"></span></div>
    <div class="titlebar-actions">
      <button id="btn-ask" class="pill-btn" data-i18n="btn.ask" data-i18n-title="btn.ask.title"></button>
      <button id="btn-stop-current" class="pill-btn danger hidden" data-i18n="shell.stopProject"></button>
      <button id="btn-new" class="pill-btn primary" data-i18n="btn.new"></button>
      <button id="btn-lang" class="pill-btn lang-btn" data-i18n="lang.switch" title="English / 中文"></button>
      <button id="btn-more" class="pill-btn more-trigger" aria-haspopup="menu" aria-controls="office-more-menu" aria-expanded="false"><span data-i18n="shell.more"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
      <div id="office-more-menu" class="action-menu hidden" role="menu">
        <button id="btn-settings" class="menu-item" role="menuitem" data-i18n="settings.head"></button>
        <button id="btn-ext" class="menu-item" role="menuitem" data-i18n="ext.head"></button>
        <button id="btn-resources" class="menu-item" role="menuitem" data-i18n="cli.title"></button>
        <button id="btn-about" class="menu-item" role="menuitem" data-i18n="about.title"></button>
      </div>
    </div>
  </div>
  <div class="titlebar-workspace">
    <nav class="workspace-nav" data-i18n-title="tb.workspace">
      <button id="btn-projects" class="pill-btn workspace-nav-btn" data-i18n-title="projects.title" aria-haspopup="dialog" aria-controls="project-modal"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6Z"/><path d="M2 8h16M7 12h6m-3-3v6"/></svg><span data-i18n="projects.title"></span></button>
      <button id="btn-browser" class="pill-btn workspace-nav-btn browser-entry" data-i18n-title="browser.title" aria-haspopup="dialog" aria-controls="browser-modal">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="3"/><path d="M2 7h16M6 5h.01M9 5h.01M7 10l-2 2 2 2m6-4 2 2-2 2"/></svg><span data-i18n="browser.title"></span>
      </button>
      <button id="btn-archive" class="pill-btn workspace-nav-btn" data-i18n-title="btn.archive.title" aria-haspopup="dialog" aria-controls="archive-modal">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 5c-2-1.5-5-2-8-1v12c3-1 6-.5 8 1 2-1.5 5-2 8-1V4c-3-1-6-.5-8 1Zm0 0v12M5 7h2m6 0h2M5 10h2m6 0h2"/></svg><span data-i18n="btn.archive.title"></span>
      </button>
      <button id="btn-chat" class="pill-btn workspace-nav-btn" data-i18n-title="btn.chat.title" aria-haspopup="dialog" aria-controls="chat-modal">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 3h10a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H8l-4 3v-3a3 3 0 0 1-2-3V6a3 3 0 0 1 3-3ZM6 7h8M6 10h5"/></svg><span data-i18n="chat.head"></span>
      </button>
    </nav>
    <div class="office-controls">
      <button id="btn-work-mode" class="pill-btn more-trigger" aria-haspopup="true" aria-controls="work-mode-menu" aria-expanded="false"><span data-i18n="shell.workMode"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
      <div id="work-mode-menu" class="action-menu work-mode-menu hidden">
      <div class="work-mode-heading"><strong data-i18n="shell.workMode"></strong><span class="hint" data-i18n="shell.modelHint"></span></div>
      <div id="fruit-tray" data-i18n-title="tray.title">
        <span class="tray-label" data-i18n="tray.label"></span>
        <div id="fruits" tabindex="0" role="group"></div>
      </div>
      <div id="effort-pill" data-i18n-title="effort.pill.title"><span aria-hidden="true">🧠</span><select id="top-effort"></select></div>
      <button id="btn-rush" class="pill-btn rush" data-i18n="btn.rush" data-i18n-title="btn.rush.title"></button>
      </div>
    </div>
  </div>
</header>

<main id="stage">
  <canvas id="office"></canvas>
  <div id="bubbles"></div>
  <div id="tooltip" class="hidden"></div>
</main>

<aside id="ticker"><div id="ticker-list"></div></aside>

<!-- agent popover -->
<div id="agent-pop" class="pop hidden">
  <div class="pop-head">
    <img id="ap-portrait" alt="" />
    <div>
      <div class="name-row"><div id="ap-name" class="h1" data-i18n-title="pop.clickRename"></div><button id="ap-rename" class="icon-btn" data-i18n-title="pop.rename">✎</button></div>
      <div id="ap-title" class="sub"></div>
      <div id="ap-status" class="chip"></div>
    </div>
    <button class="x" data-close="agent-pop">✕</button>
  </div>
  <div class="sec-title" data-i18n="pop.model"></div>
  <div id="ap-models" class="model-grid"></div>
  <div class="sec-title" data-i18n="pop.effort"></div>
  <div id="ap-effort" class="seg"></div>
  <div id="ap-duty-wrap"><div class="sec-title" data-i18n="pop.duty"></div><div id="ap-duty" class="duty"></div></div>
  <div class="sec-title" data-i18n="pop.log"></div>
  <div id="ap-log" class="log"></div>
  <div id="ap-actions"></div>
</div>

<!-- new task -->
<div id="ask-modal" class="modal hidden">
  <div class="sheet">
    <div class="sheet-head"><div class="h1" data-i18n="ask.head"></div><button class="x" id="ask-later" data-i18n-title="ask.closeTitle">✕</button></div>
    <div id="ask-sub" class="sub"></div>
    <div id="ask-list"></div>
    <div class="sheet-foot"><button id="ask-skip" class="pill-btn" data-i18n="ask.skip"></button><button id="ask-submit" class="pill-btn primary" data-i18n="ask.submit"></button></div>
  </div>
</div>
<div id="drop-overlay" class="hidden"><div data-i18n="drop.hint"></div></div>
<div id="task-modal" class="modal hidden">
  <div class="sheet">
    <div class="sheet-head"><div class="h1" data-i18n="task.head"></div><button class="x" data-close="task-modal">✕</button></div>
    <label><span data-i18n="task.titleLabel"></span><input id="task-title" data-i18n-ph="task.titlePh" maxlength="60" /></label>
    <label><span data-i18n="task.project"></span><select id="task-project"></select></label>
    <div><div class="hint" data-i18n="task.location"></div><div id="task-location" class="task-location"></div><label class="check"><input id="task-location-confirm" type="checkbox" /><span data-i18n="task.locationConfirm"></span></label></div>
    <label><span data-i18n="task.briefLabel"></span><textarea id="task-brief" rows="6" data-i18n-ph="task.briefPh"></textarea></label>
    <div class="att-field"><div class="att-label"><span data-i18n="task.att"></span><span class="hint" data-i18n="task.attHint"></span></div>
      <div id="task-drop" class="drop-zone" tabindex="0"><div id="task-dz-empty" class="dz-empty" data-i18n="task.dropEmpty"></div><div id="task-atts" class="att-list"></div></div>
    </div>
    <label><span data-i18n="task.continue"></span><select id="task-continue"><option value="" data-i18n="task.fresh"></option></select></label>
    <label class="check"><input type="checkbox" id="task-rush" /> <span data-i18n="task.rush"></span></label>
    <div class="sheet-foot"><button class="pill-btn" data-close="task-modal" data-i18n="task.cancel"></button><button id="task-submit" class="pill-btn primary" data-i18n="task.submit"></button></div>
  </div>
</div>

<!-- project chat: talk to the CEO with context, click deliverables to read them -->
<div id="chat-modal" class="modal hidden">
  <div class="sheet wide chat-sheet">
    <div class="sheet-head">
      <div class="h1" id="chat-title"></div>
      <select id="chat-proj" data-i18n-title="chat.pickProject"></select>
      <div class="spacer"></div>
      <button id="chat-stop" class="pill-btn danger hidden" data-i18n="shell.stopProject"></button>
      <button id="chat-more" class="pill-btn more-trigger" aria-haspopup="menu" aria-controls="chat-more-menu" aria-expanded="false" data-i18n="shell.more"></button>
      <div id="chat-more-menu" class="action-menu hidden" role="menu"><button id="chat-references" class="menu-item" role="menuitem" data-i18n="chat.references"></button><button id="chat-folder" class="menu-item" role="menuitem" data-i18n="chat.openFolder"></button></div>
      <button class="x" data-close="chat-modal">✕</button>
    </div>
    <div class="chat-context-bar"><span class="hint" data-i18n="chat.conversation"></span><select id="chat-conversation"></select><button id="chat-new-conversation" class="pill-btn" data-i18n="chat.newConversation"></button><span id="chat-location"></span></div>
    <div class="chat-main">
      <div class="chat-col">
        <div id="chat-log"></div>
        <div id="chat-status" class="chat-status hidden"></div>
        <div class="chat-input">
          <textarea id="chat-text" rows="2" data-i18n-ph="chat.placeholder"></textarea>
          <button id="chat-send" class="pill-btn primary" data-i18n="chat.send"></button>
        </div>
      </div>
      <div class="chat-side">
        <div id="chat-side-list"></div>
        <div id="chat-side-view" class="hidden">
          <div class="pv-actions"><button id="cp-back" class="pill-btn" data-i18n="chat.back"></button><button id="cp-open" class="pill-btn" data-i18n="chat.open"></button><button id="cp-reveal" class="pill-btn" data-i18n="chat.reveal"></button></div>
          <div id="cp-name" class="cp-name"></div>
          <div id="cp-body"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- archive -->
<div id="archive-modal" class="modal hidden">
  <div class="sheet wide">
    <div class="sheet-head"><div class="h1" data-i18n="archive.head"></div><button class="x" data-close="archive-modal">✕</button></div>
    <div class="archive-body">
      <div id="bookcase"></div>
      <div id="book-view" class="hidden">
        <div class="bv-head">
          <button id="bv-back" class="pill-btn" data-i18n="archive.back"></button>
          <div><div id="bv-title" class="h1"></div><div id="bv-meta" class="sub"></div></div>
          <div class="spacer"></div>
          <button id="bv-chat" class="pill-btn primary" data-i18n="archive.chat"></button>
          <button id="bv-folder" class="pill-btn" data-i18n="archive.reveal"></button>
        </div>
        <div class="bv-main">
          <div id="bv-files"></div>
          <div id="bv-preview"><div class="empty" data-i18n="archive.pickHint"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- settings -->
<div id="settings-modal" class="modal hidden">
  <div class="sheet wide">
    <div class="sheet-head"><div class="h1" data-i18n="settings.head"></div><button class="x" data-close="settings-modal">✕</button></div>
    <div class="settings-layout">
    <nav class="settings-jumps" data-i18n-title="settings.head"><button class="pill-btn" data-setting-jump="set-workspace" data-i18n="ctx.navGeneral"></button><button class="pill-btn" data-setting-jump="set-providers-section" data-i18n="ctx.navModels"></button><button class="pill-btn" data-setting-jump="cli-settings" data-i18n="cli.title"></button><button class="pill-btn" data-setting-jump="env-settings" data-i18n="env.title"></button><button class="pill-btn" data-setting-jump="auto-settings" data-i18n="auto.title"></button><button class="pill-btn" data-setting-jump="context-settings" data-i18n="ctx.navContext"></button><button class="pill-btn" data-setting-jump="browser-settings" data-i18n="browser.title"></button><button class="pill-btn" id="set-vault" data-i18n="vault.title"></button><button class="pill-btn" data-setting-jump="set-harness-section" data-i18n="ctx.navHarness"></button><button id="set-about" class="pill-btn" data-i18n="about.title"></button></nav>
    <div class="settings-body">
      <div class="group">
        <div class="sec-title" data-i18n="set.files"></div>
        <div class="row"><input id="set-workspace" /><button id="set-pick" class="pill-btn" data-i18n="set.pick"></button></div>
        <div class="hint" data-i18n-html="set.filesHint"></div>
      </div>
      <div class="group grid2">
        <label><span data-i18n="set.dshRoot"></span><input id="set-dsh" /></label>
        <label><span data-i18n="set.proxyPort"></span><input id="set-proxy" type="number" /></label>
        <label><span data-i18n="set.defaultModel"></span><select id="set-default"></select></label>
        <label><span data-i18n="set.defaultEffort"></span><select id="set-effort"></select></label>
        <label><span data-i18n="set.permission"></span><select id="set-perm"><option value="workspace-write" data-i18n="perm.workspace"></option><option value="danger-full-access" data-i18n="perm.full"></option></select></label>
        <label><span data-i18n="set.concurrency"></span><input id="set-conc" type="number" min="1" max="8" /></label>
        <label><span data-i18n="set.teamSize"></span><div class="row"><input id="set-min" type="number" min="1" max="8" /><input id="set-max" type="number" min="1" max="8" /></div></label>
      </div>
      <div class="group">
        <div class="sec-title" id="set-providers-section" data-i18n="set.providers"></div>
        <div class="hint" data-i18n-html="set.providersHint"></div>
        <div id="set-providers"></div>
        <div class="row"><button id="set-addprov" class="pill-btn" data-i18n="set.addProvider"></button><button id="set-import" class="pill-btn primary" data-i18n="set.import"></button></div>
        <div class="hint" data-i18n-html="set.importHint"></div>
        <div class="codex-box" id="set-codex-box">
          <div class="row"><b data-i18n="codex.title"></b><span id="codex-state" class="chip"></span><div class="spacer"></div><button id="codex-scan" class="pill-btn" data-i18n="codex.scan"></button></div>
          <div class="hint" data-i18n-html="codex.hint"></div>
          <div id="codex-models"></div>
          <div class="row"><span id="codex-msg" class="hint"></span></div>
        </div>
      </div>
      <div class="group" id="cli-settings"><div class="row"><div class="sec-title" data-i18n="cli.title"></div><span id="cli-count" class="chip"></span><div class="spacer"></div><label class="cli-inline"><input type="checkbox" id="cli-missing" /><span data-i18n="cli.showMissing"></span></label><button id="cli-all" class="pill-btn" data-i18n="cli.selectAll"></button><button id="cli-detect" class="pill-btn" data-i18n="cli.detect"></button></div><p class="hint" data-i18n="cli.hint"></p><div id="cli-list"></div><div class="row cli-custom-row"><input id="cli-custom-id" data-i18n-ph="cli.customId" /><input id="cli-custom-path" data-i18n-ph="cli.customPath" /><button id="cli-custom-add" class="pill-btn" data-i18n="cli.addCustom"></button></div><div class="row"><span id="cli-message" class="hint" role="status"></span><div class="spacer"></div><button id="cli-grant" class="pill-btn primary" data-i18n="cli.grant"></button></div></div>
      <div class="group" id="env-settings"><div class="row"><div class="sec-title" data-i18n="env.title"></div><span id="env-count" class="chip"></span><div class="spacer"></div><button id="env-clear" class="pill-btn" data-i18n="env.clear"></button><button id="env-scan" class="pill-btn primary" data-i18n="env.scan"></button></div><p class="hint" data-i18n="env.hint"></p><div id="env-list"></div><div class="row"><span id="env-message" class="hint" role="status"></span></div></div>
      <div class="group" id="auto-settings"><div class="sec-title" data-i18n="auto.title"></div><p class="hint" data-i18n="auto.hint"></p>
        <div class="grid2">
          <label><span data-i18n="auto.askTimeout"></span><input id="set-ask-timeout" type="number" min="0" max="86400" /></label>
          <label><span data-i18n="auto.retries"></span><input id="set-retries" type="number" min="0" max="5" /></label>
          <label class="check-row"><input type="checkbox" id="set-resume" /><span data-i18n="auto.resume"></span></label>
          <label class="check-row"><input type="checkbox" id="set-notify" /><span data-i18n="auto.notify"></span></label>
          <label class="check-row"><input type="checkbox" id="set-network" /><span data-i18n="auto.network"></span></label>
        </div>
      </div>
      <div class="group" id="browser-settings">
        <div class="sec-title" data-i18n="browser.settings"></div>
        <p class="hint" data-i18n="browser.securityHint"></p>
        <div class="grid2">
          <label><span data-i18n="browser.searchEngine"></span><select id="set-search"><option value="bing">Bing</option><option value="duckduckgo">DuckDuckGo</option><option value="google">Google</option><option value="custom" data-i18n="browser.custom"></option></select></label>
          <label><span data-i18n="browser.template"></span><input id="set-search-template" spellcheck="false" /></label>
          <label><span data-i18n="browser.maxPages"></span><input id="set-browser-pages" type="number" min="1" max="100" /></label>
          <label><span data-i18n="browser.maxMinutes"></span><input id="set-browser-minutes" type="number" min="1" max="60" /></label>
        </div>
        <label class="check"><input id="set-browser-private" type="checkbox" /><span data-i18n="browser.allowPrivate"></span></label>
        <label><span data-i18n="browser.blacklist"></span><textarea id="set-browser-blocked" rows="2" spellcheck="false"></textarea></label>
      </div>
      <div class="group" id="context-settings">
        <div class="row parameter-heading"><div class="sec-title" data-i18n="ctx.title"></div><div class="spacer"></div><button id="set-context-recommend" class="pill-btn" data-i18n="ctx.recommend"></button></div>
        <p class="hint" data-i18n="ctx.intro"></p>
        <label class="check"><input id="set-compact-auto" type="checkbox" /><span data-i18n="ctx.auto"></span></label>
        <div class="grid2 parameter-grid">
          <label><span data-i18n="ctx.threshold"></span><input id="set-compact-threshold" type="number" min="1" max="99" step="1" /><small data-i18n="ctx.thresholdHint"></small></label>
          <label><span data-i18n="ctx.headroom"></span><input id="set-compact-headroom" type="number" min="0" step="1024" /><small data-i18n="ctx.headroomHint"></small></label>
          <label><span data-i18n="ctx.summary"></span><input id="set-compact-summary" type="number" min="1" step="1024" /><small data-i18n="ctx.summaryHint"></small></label>
          <label><span data-i18n="ctx.retain"></span><input id="set-compact-retain" type="number" min="0" max="98" step="1" /><small data-i18n="ctx.retainHint"></small></label>
        </div>
        <details class="parameter-advanced"><summary data-i18n="ctx.advanced"></summary><div class="grid2 parameter-grid">
          <label><span data-i18n="ctx.retries"></span><input id="set-compact-retries" type="number" min="0" max="10" step="1" /></label>
          <label><span data-i18n="ctx.overflow"></span><input id="set-compact-overflow" type="number" min="0" max="10" step="1" /></label>
          <label><span data-i18n="ctx.summaryProvider"></span><input id="set-compact-provider" spellcheck="false" data-i18n-ph="ctx.follow" /></label>
          <label><span data-i18n="ctx.summaryModel"></span><input id="set-compact-model" spellcheck="false" data-i18n-ph="ctx.follow" /></label>
        </div></details>
        <div id="context-budget" aria-live="polite"></div>
        <p class="hint" data-i18n="ctx.applyHint"></p>
      </div>
      <div class="group">
        <div class="sec-title" id="set-harness-section" data-i18n="set.harness"></div>
        <div class="row"><select id="set-harness"><option value="ceo">CEO</option><option value="hr">HR</option><option value="employee" data-i18n="set.harnessEmployee"></option></select><button id="set-openharness" class="pill-btn" data-i18n="set.openFolder"></button><button id="set-log" class="pill-btn" data-i18n="set.log"></button></div>
        <textarea id="set-harness-text" rows="10" spellcheck="false"></textarea>
      </div>
    </div>
    </div>
    <div class="sheet-foot"><span id="set-msg" class="hint" role="status"></span><div class="spacer"></div><button class="pill-btn" data-close="settings-modal" data-i18n="set.cancel"></button><button id="set-save" class="pill-btn primary" data-i18n="set.save"></button></div>
  </div>
</div>

<!-- environment variable import -->
<div id="env-modal" class="modal hidden">
  <div class="sheet wide">
    <div class="sheet-head"><div class="h1" data-i18n="env.pickTitle"></div><button class="x" data-close="env-modal">✕</button></div>
    <div class="settings-body">
      <div class="env-pick-tools"><input id="env-filter" type="search" autocomplete="off" data-i18n-ph="env.filter" /><label class="cli-inline"><input type="checkbox" id="env-only-secret" checked /><span data-i18n="env.onlySecret"></span></label><select id="env-scope"><option value="all" data-i18n="env.scopeAll"></option><option value="dsh" data-i18n="env.scopeDsh"></option><option value="codex" data-i18n="env.scopeCodex"></option></select></div>
      <div id="env-pick" class="env-pick-list"></div>
      <label><span data-i18n="env.paste"></span><textarea id="env-paste" rows="4" spellcheck="false" autocomplete="off"></textarea></label>
    </div>
    <div class="sheet-foot"><span id="env-pick-msg" class="hint" role="status"></span><div class="spacer"></div><button class="pill-btn" data-close="env-modal" data-i18n="set.cancel"></button><button id="env-import" class="pill-btn primary" data-i18n="env.import"></button></div>
  </div>
</div>

<!-- extension center: plugins / MCP / experts -->
<div id="ext-modal" class="modal hidden">
  <div class="sheet wide">
    <div class="sheet-head"><div class="h1" data-i18n="ext.head"></div><button class="x" data-close="ext-modal">✕</button></div>
