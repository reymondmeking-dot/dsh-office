name: release

# Builds portable packages for Windows x64, Linux x64 and macOS (Apple Silicon
# arm64 + Intel x64). Pushing a tag like v1.0.0 also creates a public GitHub
# Release with every archive attached.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build app folder
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1
      - name: Zip portable folder
        shell: pwsh
        run: Compress-Archive -Path "dist/DSH Office" -DestinationPath "dist/DSH-Office-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with: { name: DSH-Office-windows-x64, path: dist/DSH-Office-windows-x64.zip }

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unzip
      - name: Build portable folder + tarball
        run: bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: DSH-Office-linux-x64, path: dist/dsh-office-linux-x64.tar.gz }

  macos-arm64:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build .app + zip
        run: bash scripts/build-macos.sh arm64
      - uses: actions/upload-artifact@v4
        with: { name: DSH-Office-macos-arm64, path: dist/DSH-Office-macos-arm64.zip }

  macos-x64:
    name: macOS Intel (x64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build .app + zip
        run: bash scripts/build-macos.sh x64
      - uses: actions/upload-artifact@v4
        with: { name: DSH-Office-macos-x64, path: dist/DSH-Office-macos-x64.zip }

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: false }
      - name: Flatten archives
        run: |
          find dist -mindepth 2 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec mv {} dist/ \;
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DSH-Office-windows-x64.zip
            dist/dsh-office-linux-x64.tar.gz
            dist/DSH-Office-macos-arm64.zip
            dist/DSH-Office-macos-x64.zip
